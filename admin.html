<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Configurações do Site</title>
    <meta name="robots" content="noindex">
    <style>
        :root {
            --bg: #0B0F19;
            --surface: #151B29;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #0066FF;
            --primary-hover: #0052CC;
            --secondary: #00D4FF;
            --text: #FFFFFF;
            --text-muted: #AAB4C8;
            --success: #25D366;
            --error: #FF6B6B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--surface);
            padding: 32px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-header { text-align: center; margin-bottom: 24px; }
        .card-header h1 { font-size: 22px; color: var(--secondary); margin-bottom: 6px; }
        .card-header p { font-size: 13px; color: var(--text-muted); }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus { outline: none; border-color: var(--primary); }
        .help-text { font-size: 11px; color: rgba(170, 180, 200, 0.6); margin-top: 4px; }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: .6; cursor: not-allowed; }

        .alert {
            display: none;
            text-align: center;
            margin-top: 16px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .alert.ok {
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert.erro {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h1>⚙️ Painel de Controle</h1>
            <p>Gerencie contatos, redes sociais e tags do site</p>
        </div>

        <div class="form-group">
            <label for="senhaInput">Senha do painel:</label>
            <input type="password" id="senhaInput" placeholder="Senha (ADMIN_TOKEN)">
            <div class="help-text">A mesma senha configurada nas Propriedades do script na planilha.</div>
        </div>

        <hr>

        <div class="form-group">
            <label for="waInput">Número do WhatsApp:</label>
            <input type="text" id="waInput" placeholder="Ex: 5511972608991">
            <div class="help-text">Código do país (55) + DDD + Número</div>
        </div>

        <div class="form-group">
            <label for="instaInput">Link do Instagram:</label>
            <input type="text" id="instaInput" placeholder="https://instagram.com/seuusuario">
        </div>

        <div class="form-group">
            <label for="faceInput">Link do Facebook:</label>
            <input type="text" id="faceInput" placeholder="https://facebook.com/suapagina">
        </div>

        <div class="form-group">
            <label for="pixelInput">ID do Meta Pixel:</label>
            <input type="text" id="pixelInput" placeholder="Ex: 123456789012345">
        </div>

        <div class="form-group">
            <label for="googleInput">ID da Google Tag (GA4 / Ads):</label>
            <input type="text" id="googleInput" placeholder="Ex: G-XXXXXXXXXX ou AW-123456789">
        </div>

        <button id="salvarBtn" onclick="salvarConfiguracoes()">Salvar Alterações</button>

        <div id="alertOk" class="alert ok">✅ Configurações salvas com sucesso!</div>
        <div id="alertErro" class="alert erro">❌ Não foi possível salvar. Confira a senha e tente de novo.</div>
    </div>

    <script>
        // Mesma URL usada no script.js do site
        const APP_URL = "https://script.google.com/macros/s/AKfycbxgJkhJw1aUD6bFWxv8xqrhE5udnKqWUfGAUXJKnasMlG21DyfBbh8uhlHS4XjQeluyXQ/exec";

        document.addEventListener("DOMContentLoaded", carregarConfiguracoes);

        // Lembra a senha só neste navegador, pra não digitar toda vez
        const senhaSalva = localStorage.getItem("admin_senha");
        if (senhaSalva) document.getElementById("senhaInput").value = senhaSalva;

        async function carregarConfiguracoes() {
            try {
                const res = await fetch(APP_URL);
                const data = await res.json();
                document.getElementById("waInput").value = data.whatsapp || "";
                document.getElementById("instaInput").value = data.instagram || "";
                document.getElementById("faceInput").value = data.facebook || "";
                document.getElementById("pixelInput").value = data.pixel_id || "";
                document.getElementById("googleInput").value = data.google_id || "";
            } catch (erro) {
                mostrarAlerta("erro", "Não foi possível carregar as configurações atuais da planilha.");
            }
        }

        async function salvarConfiguracoes() {
            const btn = document.getElementById("salvarBtn");
            const senha = document.getElementById("senhaInput").value.trim();

            if (!senha) {
                mostrarAlerta("erro", "Digite a senha do painel para salvar.");
                return;
            }

            const config = {
                token: senha,
                whatsapp: document.getElementById("waInput").value.trim(),
                instagram: document.getElementById("instaInput").value.trim(),
                facebook: document.getElementById("faceInput").value.trim(),
                pixel_id: document.getElementById("pixelInput").value.trim(),
                google_id: document.getElementById("googleInput").value.trim()
            };

            btn.disabled = true;

            try {
                const res = await fetch(APP_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(config)
                });
                const data = await res.json();

                if (data.ok) {
                    localStorage.setItem("admin_senha", senha);
                    mostrarAlerta("ok");
                } else {
                    mostrarAlerta("erro", data.error ? ("❌ " + data.error) : null);
                }
            } catch (erro) {
                mostrarAlerta("erro");
            } finally {
                btn.disabled = false;
            }
        }

        function mostrarAlerta(tipo, texto) {
            const ok = document.getElementById("alertOk");
            const erro = document.getElementById("alertErro");
            ok.style.display = "none";
            erro.style.display = "none";

            const alvo = tipo === "ok" ? ok : erro;
            if (texto) alvo.textContent = texto;
            alvo.style.display = "block";
            setTimeout(() => alvo.style.display = "none", 4000);
        }
    </script>
</body>
</html>
