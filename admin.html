<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - BTV Assistência</title>
    <style>
        :root {
            --bg: #0B0F19;
            --surface: #151B29;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #0066FF;
            --primary-hover: #0052CC;
            --secondary: #00D4FF;
            --text: #FFFFFF;
            --text-muted: #AAB4C8;
            --success: #25D366;
            --danger: #FF4D4D;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: var(--surface); padding: 32px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 440px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .card-header { text-align: center; margin-bottom: 24px; }
        .card-header h1 { font-size: 22px; color: var(--secondary); margin-bottom: 6px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: var(--bg); color: var(--text); font-size: 14px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: var(--primary-hover); }
        .alert { display: none; text-align: center; margin-top: 16px; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 13px; }
        .alert-success { background: rgba(37, 211, 102, 0.1); border: 1px solid var(--success); color: var(--success); }
        .alert-danger { background: rgba(255, 77, 77, 0.1); border: 1px solid var(--danger); color: var(--danger); }
        #admin-content { display: none; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div class="card" id="login-box">
        <div class="card-header"><h1>🔒 Acesso Restrito</h1></div>
        <div class="form-group">
            <label>Senha:</label>
            <input type="password" id="passInput">
        </div>
        <button onclick="verificarSenha()">Entrar</button>
        <div id="login-alert" class="alert alert-danger">❌ Senha incorreta!</div>
    </div>

    <!-- PAINEL -->
    <div class="card" id="admin-content">
        <div class="card-header"><h1>⚙️ Configurações</h1></div>
        <div class="form-group">
            <label>WhatsApp:</label>
            <input type="text" id="waInput" placeholder="5511999999999">
        </div>
        <div class="form-group">
            <label>Instagram:</label>
            <input type="text" id="instaInput">
        </div>
        <div class="form-group">
            <label>Facebook:</label>
            <input type="text" id="faceInput">
        </div>
        <div class="form-group">
            <label>ID Meta Pixel:</label>
            <input type="text" id="pixelInput">
        </div>
        <div class="form-group">
            <label>ID Google Tag:</label>
            <input type="text" id="googleInput">
        </div>
        <button onclick="salvarConfiguracoes()">Salvar na Nuvem</button>
        <div id="alert" class="alert alert-success">✅ Salvo com sucesso!</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnh-PkX6IixSz8DsUWlKi3HkRLjEurGrY",
            projectId: "btvassistenciatecnica",
            authDomain: "btvassistenciatecnica.firebaseapp.com",
            storageBucket: "btvassistenciatecnica.firebasestorage.app",
            messagingSenderId: "855769187312",
            appId: "1:855769187312:web:72b25d02059b1beb8dd335"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const SENHA_CORRETA = "admin123";

        window.verificarSenha = async () => {
            if (document.getElementById("passInput").value === SENHA_CORRETA) {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("admin-content").style.display = "block";
                const docSnap = await getDoc(doc(db, "configuracoes", "site"));
                if (docSnap.exists()) {
                    const d = docSnap.data();
                    document.getElementById("waInput").value = d.whatsapp || "";
                    document.getElementById("instaInput").value = d.instagram || "";
                    document.getElementById("faceInput").value = d.facebook || "";
                    document.getElementById("pixelInput").value = d.pixel_id || "";
                    document.getElementById("googleInput").value = d.google_id || "";
                }
            } else {
                document.getElementById("login-alert").style.display = "block";
                setTimeout(() => document.getElementById("login-alert").style.display = "none", 2000);
            }
        };

        window.salvarConfiguracoes = async () => {
            await setDoc(doc(db, "configuracoes", "site"), {
                whatsapp: document.getElementById("waInput").value,
                instagram: document.getElementById("instaInput").value,
                facebook: document.getElementById("faceInput").value,
                pixel_id: document.getElementById("pixelInput").value,
                google_id: document.getElementById("googleInput").value
            });
            document.getElementById("alert").style.display = "block";
            setTimeout(() => document.getElementById("alert").style.display = "none", 2000);
        };
    </script>
</body>
</html>
