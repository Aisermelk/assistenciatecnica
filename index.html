<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTV Assistência Técnica</title>
    <style>
        :root {
            --bg: #0B0F19;
            --surface: #151B29;
            --primary: #0066FF;
            --secondary: #00D4FF;
            --text: #FFFFFF;
            --text-muted: #AAB4C8;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
            padding: 50px 20px;
        }

        h1 { color: var(--secondary); margin-bottom: 10px; }
        p { color: var(--text-muted); margin-bottom: 30px; }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin: 10px;
            transition: 0.3s;
        }

        .btn:hover { background: var(--secondary); color: var(--bg); }
        
        .social-links { margin-top: 30px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>BTV Assistência Técnica</h1>
        <p>Suporte especializado para o seu dispositivo.</p>

        <!-- Botões de Ação -->
        <a href="#" id="wa-link" class="btn">Falar no WhatsApp</a>
        
        <div class="social-links">
            <a href="#" id="insta-link" class="btn" style="background: #e1306c;">Instagram</a>
            <a href="#" id="face-link" class="btn" style="background: #4267B2;">Facebook</a>
        </div>
    </div>

    <!-- LÓGICA DE INTEGRAÇÃO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Config (ID do seu projeto)
        const firebaseConfig = {
            apiKey: "AIzaSyCnh-PkX6IixSz8DsUWlKi3HkRLjEurGrY",
            authDomain: "btvassistenciatecnica.firebaseapp.com",
            projectId: "btvassistenciatecnica",
            storageBucket: "btvassistenciatecnica.firebasestorage.app",
            messagingSenderId: "855769187312",
            appId: "1:855769187312:web:72b25d02059b1beb8dd335",
            measurementId: "G-W2RBX4JLR6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const docRef = doc(db, "configuracoes", "site");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const config = docSnap.data();

                    // 1. Atualizar WhatsApp
                    if (config.whatsapp) {
                        document.getElementById("wa-link").href = `https://wa.me/${config.whatsapp}?text=Olá! Preciso de suporte para BTV.`;
                    }

                    // 2. Atualizar Redes Sociais
                    if (config.instagram) document.getElementById("insta-link").href = config.instagram;
                    if (config.facebook) document.getElementById("face-link").href = config.facebook;

                    // 3. Injetar Meta Pixel
                    if (config.pixel_id) {
                        !function(f,b,e,v,n,t,s) {
                            if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
                            if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];
                            t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];
                            s.parentNode.insertBefore(t,s)
                        }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
                        fbq('init', config.pixel_id);
                        fbq('track', 'PageView');
                    }

                    // 4. Injetar Google Tag
                    if (config.google_id) {
                        const script = document.createElement("script");
                        script.async = true;
                        script.src = `https://www.googletagmanager.com/gtag/js?id=${config.google_id}`;
                        document.head.appendChild(script);
                        window.dataLayer = window.dataLayer || [];
                        function gtag(){dataLayer.push(arguments);}
                        gtag('js', new Date());
                        gtag('config', config.google_id);
                    }
                }
            } catch (e) {
                console.error("Erro ao carregar dados do Firebase:", e);
            }
        });
    </script>
</body>
</html>
