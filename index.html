<script>
    // COLE AQUI A URL DO SEU APP DA WEB (GERADA NA PLANILHA DO GOOGLE)
    const API_URL = "SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI";

    fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            if (data.whatsapp) {
                // Monta o link correto do WhatsApp com mensagem padrão
                const waUrl = `https://wa.me/${data.whatsapp}?text=Olá! Quero atendimento para BTV e TV Box.`;
                
                // Pega TODOS os botões que usam a classe do seu HTML (.js-wa-link)
                const waLinks = document.querySelectorAll(".js-wa-link");
                waLinks.forEach(link => {
                    link.href = waUrl;
                });
            }

            // Atualiza Instagram se houver
            if (data.instagram) {
                document.querySelectorAll(".js-insta-link").forEach(link => {
                    link.href = data.instagram;
                });
            }

            // Atualiza Facebook se houver
            if (data.facebook) {
                document.querySelectorAll(".js-face-link").forEach(link => {
                    link.href = data.facebook;
                });
            }
        })
        .catch(error => console.error("Erro ao carregar dados da planilha:", error));
</script>
