backend:
  name: github
  repo: SEU_USUARIO/SEU_REPOSITORIO   # troque pelo seu usuário/repositório do GitHub
  branch: main
  base_url: https://SEU-SITE.pages.dev   # troque pela URL do seu site no Cloudflare Pages
  auth_endpoint: api/auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site"
    label: "Conteúdo do Site"
    files:

      - name: "content"
        label: "Textos, WhatsApp, Facebook, FAQ e Depoimentos"
        file: "content/site-content.json"
        fields:

          - { label: "Número do WhatsApp (só números, com DDI 55 e DDD)", name: "whatsapp", widget: "string" }
          - { label: "Link do Facebook", name: "facebook", widget: "string" }

          - label: "Rastreamento (Pixel e Google Tag)"
            name: "tracking"
            widget: "object"
            hint: "Cole aqui os IDs do seu Pixel da Meta e do Google Tag (GA4). Deixe em branco para não carregar."
            fields:
              - { label: "ID do Pixel da Meta (Facebook/Instagram Ads)", name: "meta_pixel_id", widget: "string", required: false, hint: "Exemplo: 1234567890123456" }
              - { label: "ID do Google Tag / GA4", name: "ga4_id", widget: "string", required: false, hint: "Exemplo: G-XXXXXXXXXX" }

          - label: "Topo (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Selo/Badge", name: "badge", widget: "string" }
              - { label: "Título - linha 1", name: "title_line1", widget: "string" }
              - { label: "Título - destaque", name: "title_highlight", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "text" }
              - { label: "Botão principal (WhatsApp)", name: "cta_primary", widget: "string" }
              - { label: "Botão secundário", name: "cta_secondary", widget: "string" }
              - { label: "Texto antes do link do formulário", name: "form_hint", widget: "string" }
              - { label: "Texto do link do formulário", name: "form_hint_link", widget: "string" }
              - { label: "Card flutuante - título", name: "floating_card_title", widget: "string" }
              - { label: "Card flutuante - texto", name: "floating_card_text", widget: "string" }

          - label: "Barra de confiança (4 itens)"
            name: "trust_bar"
            widget: "list"
            fields:
              - { label: "Título (com ícone)", name: "title", widget: "string" }
              - { label: "Texto", name: "text", widget: "string" }

          - label: "Benefícios"
            name: "benefits"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "text" }
              - label: "Itens"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Ícone (emoji)", name: "icon", widget: "string" }
                  - { label: "Título", name: "title", widget: "string" }
                  - { label: "Texto", name: "text", widget: "text" }

          - label: "Serviços"
            name: "services"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "text" }
              - label: "Itens"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Ícone (emoji)", name: "icon", widget: "string" }
                  - { label: "Título", name: "title", widget: "string" }
                  - { label: "Texto", name: "text", widget: "text" }

          - label: "Como Funciona"
            name: "steps"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "text" }
              - label: "Passos"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Número", name: "number", widget: "string" }
                  - { label: "Título", name: "title", widget: "string" }
                  - { label: "Texto", name: "text", widget: "text" }

          - label: "Depoimentos"
            name: "testimonials"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - label: "Itens"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Estrelas", name: "stars", widget: "string", default: "★★★★★" }
                  - { label: "Depoimento", name: "text", widget: "text" }
                  - { label: "Nome do cliente", name: "name", widget: "string" }

          - label: "Perguntas Frequentes"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - label: "Perguntas"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Pergunta", name: "question", widget: "string" }
                  - { label: "Resposta", name: "answer", widget: "text" }

          - label: "Formulário de Atendimento"
            name: "lead_form"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "text" }
              - { label: "Texto do botão", name: "button", widget: "string" }
              - { label: "Mensagem de sucesso", name: "success_message", widget: "string" }
              - { label: "Mensagem de erro", name: "error_message", widget: "string" }

          - label: "CTA Final"
            name: "cta_final"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "string" }
              - { label: "Texto do botão", name: "button", widget: "string" }

          - label: "Rodapé"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Descrição", name: "description", widget: "text" }
              - { label: "Horário - linha 1", name: "hours_line1", widget: "string" }
              - { label: "Horário - linha 2", name: "hours_line2", widget: "string" }
